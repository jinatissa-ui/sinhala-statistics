<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සංඛ්‍යානය - පිටුව 4</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        table.data-table {
            width: 50%;
            border-collapse: collapse;
            font-size: 16px;
            background-color: #fff;
        }

        table.data-table th, table.data-table td {
            border: 1px solid #cccccc;
            padding: 4px 6px;
            text-align: center;
        }

        table.data-table th {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .chart-box {
            width: 50%;
            text-align: center;
        }

        svg {
            transform: rotate(-90deg);
            border-radius: 50%;
            cursor: pointer;
        }

        /* සරල රේඛාවලින් කේන්ද්‍රඛණ්ඩ වෙන් කිරීම සඳහා stroke අගය තද කර ඇත */
        .sector {
            fill: #e0e0e0;
            stroke: #222222;
            stroke-width: 0.2;
            transition: fill 0.4s ease;
        }

        .sector:hover {
            opacity: 0.85;
        }

        .info-card {
            background-color: #f1f8e9;
            border: 1px solid #c5e1a5;
            border-radius: 6px;
            padding: 8px;
            margin-top: 10px;
            font-size: 16px;
            min-height: 48px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .color-box {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            border: 1px solid #333;
        }
		.btn-reset {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-reset:hover {
            background-color: #c82333;
        }
		
		
    </style>
</head>
<body>

    <div class="page">
        <div>
            <!-- Header -->
            <div class="header">
                <h1 class="title">දත්ත නිරූපණය - වෘත්ත ප්‍රස්ථාරය</h1>
            </div>

            <h2 class="subtitle">පන්තියේ ළමුන් 25 දෙනෙකු කැමති ආහාර වර්ග</h2>
            <p style="font-size: 16px; margin-bottom: 6px;">
                වෘත්ත ප්‍රස්ථාරයේ  කේන්ද්‍රඛණ්ඩ මත ක්ලික් කර ඒවා වර්ණවත් කරන්න.
            </p>

            <div class="flex-container">
                <!-- Table -->
                <table class="data-table">
                    <tr>
                        <th>ආහාරය</th>
                        <th>ළමුන්</th>
                        <th>ප්‍රතිශතය</th>
                    </tr>
                    <tr>
                        <td>ආප්ප </td>
                        <td>10</td>
                        <td><b>40%</b></td>
                    </tr>
                    <tr>
                        <td>ඉඳිආප්ප </td>
                        <td>8</td>
                        <td><b>32%</b></td>
                    </tr>
                    <tr>
                        <td>රොටී </td>
                        <td>5</td>
                        <td><b>20%</b></td>
                    </tr>
                    <tr>
                        <td>පාන් </td>
                        <td>2</td>
                        <td><b>8%</b></td>
                    </tr>
                    <tr style="background-color: #fafafa; font-weight: bold;">
                        <td>එකතුව</td>
                        <td>25</td>
                        <td>100%</td>
                    </tr>
                </table>

                <!-- Pie Chart SVG -->
                <div class="chart-box">
                    <svg width="150" height="150" viewBox="0 0 32 32">
                        <!-- Aappa: 40% -->
                        <path class="sector" id="sec-1" d="M16 16 L16 0 A16 16 0 0 1 28.94 25.4 Z" onclick="revealSector('sec-1', '#ff5722', 'ආප්ප: 40% (ළමුන් 10/25 - කෝණය 144°)')"/>
                        <!-- Indiaappa: 32% -->
                        <path class="sector" id="sec-2" d="M16 16 L28.94 25.4 A16 16 0 0 1 0.28 20.95 Z" onclick="revealSector('sec-2', '#00bcd4', 'ඉඳිආප්ප: 32% (ළමුන් 8/25 - කෝණය 115.2°)')"/>
                        <!-- Roti: 20% -->
                        <path class="sector" id="sec-3" d="M16 16 L0.28 20.95 A16 16 0 0 1 8.27 1.99 Z" onclick="revealSector('sec-3', '#4caf50', 'රොටී: 20% (ළමුන් 5/25 - කෝණය 72°)')"/>
                        <!-- Paan: 8% -->
                        <path class="sector" id="sec-4" d="M16 16 L8.27 1.99 A16 16 0 0 1 16 0 Z" onclick="revealSector('sec-4', '#ffeb3b', 'පාන්: 8% (ළමුන් 2/25 - කෝණය 28.8°)')"/>
                    </svg>

                    <!-- Legend -->
                    <div class="legend">
                        <div class="legend-item"><div class="color-box" style="background:#ff5722;"></div>ආප්ප</div>
                        <div class="legend-item"><div class="color-box" style="background:#00bcd4;"></div>ඉඳිආප්ප</div>
                        <div class="legend-item"><div class="color-box" style="background:#4caf50;"></div>රොටී</div>
                        <div class="legend-item"><div class="color-box" style="background:#ffeb3b;"></div>පාන්</div>
                    </div>
                </div>
            </div>

            <!-- Info Message Box -->
            <div id="infoBox" class="info-card">
                👈 ප්‍රස්ථාරයේ කොටසක් මත ක්ලික් කරන්න.
            </div>
			<button onclick="relod()" class="btn-reset"> නැවතත් </button>
        </div>

        <!-- Footer -->
        
    </div>

    <script>
        function revealSector(id, color, text) {
            document.getElementById(id).style.fill = color;
            document.getElementById('infoBox').innerHTML = `📌 <b>තොරතුරු:</b> ${text}`;
        }
		function relod() {
    location.reload(); // entire page reload
  }
    </script>
</body>
</html>
