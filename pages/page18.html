<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>සංඛ්‍යානය - පිටුව 6</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .instructions {
    color: #d9534f;
    font-size: 16px;
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    font-size: 16px;
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    resize: none;
  }

  .btn-group {
    margin: 6px 0;
    display: flex;
    gap: 8px;
  }

  button.btn {
    background: #007bff;
    color: white;
    padding: 5px 10px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.15);
    transition: 0.2s;
  }

  button.btn:hover {
    background: #0056b3;
  }

  button.btn-clear {
    background: #dc3545;
  }

  button.btn-clear:hover {
    background: #c82333;
  }

  /* Style the tab */
  .tab {
    overflow: hidden;
    border: 1px solid #ccc;
    background-color: #e9ecef;
    border-radius: 4px 4px 0 0;
    margin-top: 6px;
  }

  .tab button {
    background-color: inherit;
    float: left;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 6px 8px;
    transition: 0.3s;
    font-size: 16px;
    font-weight: bold;
    width: 33.33%;
  }

  .tab button:hover {
    background-color: #ddd;
  }

  .tab button.active {
    background-color: #007bff;
    color: white;
  }

  /* Style the tab content */
  .tabcontent {
    display: none;
    padding: 8px;
    border: 1px solid #ccc;
    border-top: none;
    background-color: #fff;
    border-radius: 0 0 4px 4px;
    height: 180px;
    box-sizing: border-box;
  }

  h4 {
    font-size: 16px;
    color: #444;
    margin: 0 0 6px 0;
    font-weight: normal;
    line-height: 1.3;
  }

  .res-text {
    font-size: 16px;
    color: #0056b3;
    font-weight: bold;
    display: block;
    margin-top: 6px;
  }
</style>
</head>
<body>

  <div class="page">
    <div>
      <!-- Header -->
      <div class="header">
        <h1 class="title">මාතය, මධ්‍යස්ථය හා මධ්‍යන්‍යය</h1>
      </div>

      <p class="instructions">සංඛ්‍යා වෙනස් කළ හැක. අලුතෙන් සංඛ්‍යා යොදන විට පරතර (Space) එකක් පමණක් තබා යොදන්න.</p>

      <textarea rows="2" id="t1">5 6 3 12 9 3</textarea>

      <div class="btn-group">
        <button class="btn" onclick="nxt()">වෙනත් උදාහරණයක්</button>
        <button class="btn btn-clear" onclick="cls()">මකන්න</button>
      </div>
<br><br>
      <!-- Tabs -->
      <div class="tab">
        <button class="tablinks active" onclick="open1(event, 'step1')">මාතය</button>
        <button class="tablinks" onclick="open1(event, 'step2')">මධ්‍යස්ථය</button>
        <button class="tablinks" onclick="open1(event, 'step3')">මධ්‍යන්‍යය</button>
      </div>

      <!-- Mode Tab -->
      <div id="step1" class="tabcontent" style="display: block;">
        <h4>වැඩිම වාර ගණනක් යෙදී ඇති සංඛ්‍යාව:</h4>
        <button class="btn" onclick="st1()">මාතය සොයමු</button>
        <span id="txt1" class="res-text"></span> 
      </div>

      <!-- Median Tab -->
      <div id="step2" class="tabcontent">
        <h4>ආරෝහණ පිළිවෙළට සකස් කළ විට මැද සංඛ්‍යාව:<br>
        <small style="color:#666;font-size:14px">(පද ගණන ඉරට්ටේ නම් මැද සංඛ්‍යා 2හි එකතුව 2න් බෙදන්න)</small></h4>
        <textarea rows="1" id="t2" readonly style="background:#f0f0f0;"></textarea>
        <div style="margin-top: 4px;">
          <button class="btn" onclick="st2()">මධ්‍යස්ථය සොයමු</button>
		  
        </div>
        <span id="txt2" class="res-text"></span>
      </div>

      <!-- Mean Tab -->
      <div id="step3" class="tabcontent">
        <h4>පද සියල්ලගේ එකතුව පද ගණනින් බෙදා ලැබෙන අගය:</h4>
        <span id="tx1" style="font-size:16px; color:#333;"></span><br>
        <span id="tx2" style="font-size:16px; color:#333;"></span><br>
        <button class="btn" onclick="st3()" style="margin-top:4px;">මධ්‍යන්‍යය සොයමු</button>
        <span id="txt3" class="res-text"></span>
      </div>
    </div>

    <!-- Footer -->
    
  </div>

<script>
function open1(evt, cName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  document.getElementById(cName).style.display = "block";
  evt.currentTarget.className += " active";
}

function getNumbers() {
  var val = document.getElementById("t1").value.trim();
  if (!val) return [];
  return val.split(/\s+/).map(Number).filter(n => !isNaN(n));
}

function st1() {
  var numbers = getNumbers();
  if (numbers.length === 0) {
    document.getElementById("txt1").innerHTML = "සංඛ්‍යා ඇතුළත් කරන්න.";
    return;
  }

  var count = {}, maxIndex = 0, modes = [];
  for (var i = 0; i < numbers.length; i++) {
    var num = numbers[i];
    count[num] = (count[num] || 0) + 1;
    if (count[num] > maxIndex) {
      maxIndex = count[num];
    }
  }

  for (var k in count) {
    if (count[k] === maxIndex) {
      modes.push(Number(k));
    }
  }

  var txt1 = document.getElementById("txt1");
  if (maxIndex === 1 && numbers.length > 1) {
    txt1.innerHTML = "මාතයක් නොමැත.";
  } else if (modes.length > 1) {
    txt1.innerHTML = "මාතයන්: " + modes.join(", ") + " (බහු මාත)";
  } else {
    txt1.innerHTML = "මාතය: " + modes[0];
  }
}

function st2() {
  var numbers = getNumbers();
  if (numbers.length === 0) {
    document.getElementById("txt2").innerHTML = "සංඛ්‍යා ඇතුළත් කරන්න.";
    return;
  }

  numbers.sort(function(a, b) { return a - b; });
  document.getElementById("t2").value = numbers.join(", ");

  var len = numbers.length;
  var medianVal;

  if (len % 2 === 0) {
    var mid1 = numbers[len / 2 - 1];
    var mid2 = numbers[len / 2];
    medianVal = (mid1 + mid2) / 2;
  } else {
    medianVal = numbers[Math.floor(len / 2)];
  }

  document.getElementById("txt2").innerHTML = "මධ්‍යස්ථය: " + medianVal;
}

function st3() {
  var numbers = getNumbers();
  if (numbers.length === 0) {
    document.getElementById("txt3").innerHTML = "සංඛ්‍යා ඇතුළත් කරන්න.";
    return;
  }

  var total = 0;
  for (var i = 0; i < numbers.length; i++) {
    total += numbers[i];
  }

  var meanVal = (total / numbers.length).toFixed(2);

  document.getElementById("tx1").innerHTML = "පදවල එකතුව: <b>" + total + "</b>";
  document.getElementById("tx2").innerHTML = "පද ගණන: <b>" + numbers.length + "</b>";
  document.getElementById("txt3").innerHTML = "මධ්‍යන්‍යය: " + meanVal;
}

function cls() {
  document.getElementById("t1").value = "";
  document.getElementById("t2").value = "";
  document.getElementById("txt1").innerHTML = "";
  document.getElementById("txt2").innerHTML = "";
  document.getElementById("txt3").innerHTML = "";
  document.getElementById("tx1").innerHTML = "";
  document.getElementById("tx2").innerHTML = "";
}

var examples = [
  "7 5 4 8 4",
  "12 10 8 15 11 9 12",
  "5 9 8 2 4 1 8 5 3 6",
  "35 43 22 47 44 38 28 15 32 44 27 20",
  "125 93 122 106 100 112 106 115 97"
];
var currIndex = 0;

function nxt() {
  document.getElementById("t1").value = examples[currIndex];
  currIndex = (currIndex + 1) % examples.length;
  cls();
  document.getElementById("t1").value = examples[(currIndex === 0 ? examples.length : currIndex) - 1];
}
</script>

</body>
</html>
