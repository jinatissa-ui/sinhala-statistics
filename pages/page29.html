<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>2024 O/L - පිටුව 02</title>
	<link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
        }
        .paper-page4 {
            width: 470px;
            height: 550px;
            background: #ffffff;
            border: 1px solid #b2bec3;
            padding: 10px 12px;
            box-sizing: border-box;
            margin: 0 auto;
            font-size: 12px;
            line-height: 1.3;
        }
        .header85 {
            text-align: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 3px;
            margin-bottom: 5px;
        }
        .header h4 { margin: 0; font-size: 13px; }
        
        .tbl-data {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0;
        }
        .tbl-data th, .tbl-data td {
            border: 1px solid #444;
            padding: 2px 3px;
            text-align: center;
            font-size: 11px;
        }
        .tbl-data input {
            width: 42px;
            padding: 1px;
            text-align: center;
            font-size: 11px;
            border: 1px solid #888;
            border-radius: 2px;
        }
        .mark-status {
            font-weight: bold;
            font-size: 11px;
            margin-left: 2px;
        }

        .svg-container {
            text-align: center;
            margin: 3px 0;
        }
        svg {
            background-color: #ffffff;
            border: 1px solid #7f8c8d;
        }
        .grid-line { stroke: #e0e0e0; stroke-width: 1; }
        .axis-line { stroke: #000; stroke-width: 1.5; }
        .point-dot { fill: #e74c3c; r: 3.5; }
        .user-bar {
            fill: rgba(52, 152, 219, 0.4);
            stroke: #2980b9;
            stroke-width: 1.5;
        }
        .correct-bar {
            fill: rgba(39, 174, 96, 0.3);
            stroke: #27ae60;
            stroke-width: 2;
            stroke-dasharray: 3,3;
        }

        .short-input {
            width: 60px;
            padding: 1px;
            text-align: center;
            font-size: 14px;
        }
        .btn-check {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-show-ans {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            display: none;
            margin-left: 5px;
        }
        .btn-clear {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
        }
        .score-box {
            margin-top: 4px;
            padding: 4px;
            background: #eef9f1;
            border: 1px dashed #27ae60;
            font-size: 12px;
            font-weight: bold;
            color: #1e8449;
            text-align: center;
            display: none;
        }
        .nav-btn {
            float: left;
            background: #7f8c8d;
            color: #fff;
            text-decoration: none;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
        }
        .correct-input { background-color: #d4edda; border-color: #28a745; }
        .wrong-input { background-color: #f8d7da; border-color: #dc3545; }
        .ans-hint { font-size: 10px; color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <div class="page">
        
        <div class="header">
            <h4>අ.පො.ස. (සාමාන්‍ය පෙළ) - 2024 | ගණිතය  B කොටස  ප්‍රශ්න අංක 4</h4>
        </div>

        <!-- 1. Table Section -->
        <p style="margin: 2px 0;font-size:14px"><b>(i) සහ (iii) වගුවේ හිස්තැන් පුරවන්න:</b></p>
        <table class="tbl-data">
            <tr>
                <th>ලකුණු</th>
                <th>10–20</th><th>20–30</th><th>30–50</th><th>50–60</th><th>60–90</th>
            </tr>
            <tr>
                <td><b>සිසුන් <br>ගණන (f)</b></td>
                <td>20</td>
                <td><input type="number" id="f-20-30"><span id="m-f-20" class="mark-status"></span></td>
                <td>60</td>
                <td><input type="number" id="f-50-60"><span id="m-f-50" class="mark-status"></span></td>
                <td><input type="number" id="f-60-90"><span id="m-f-60" class="mark-status"></span></td>
            </tr>
            <tr>
                <td><b>සමුච්චිත <br>සංඛ්‍යාතය (cf)</b></td>
                <td>20</td>
                <td><input type="number" id="cf-20-30"><span id="m-cf-20" class="mark-status"></span></td>
                <td><input type="number" id="cf-30-50"><span id="m-cf-30" class="mark-status"></span></td>
                <td><input type="number" id="cf-50-60"><span id="m-cf-50" class="mark-status"></span></td>
                <td><input type="number" id="cf-60-90"><span id="m-cf-60" class="mark-status"></span></td>
            </tr>
        </table>

        <!-- 2. SVG Histogram Section -->
        <p style="margin: 2px 0;font-size:14px"><b>(ii) ජාලරේඛය:</b> රේඛා කැපෙන තැන්වල මුලු 4ක් ක්ලික් කර තීරුව සාදන්න.</p>
        <div class="svg-container">
            <svg id="gridSvg" width="350" height="150">
                <g id="gridLines"></g>
                <g id="axes"></g>
                <g id="labels" font-size="8" fill="#333"></g>
                <g id="correctHistoG"></g>
                <g id="drawnPolygons"></g>
                <g id="activePoints"></g>
                <circle id="snapMarker" cx="-10" cy="-10" r="4" fill="none" stroke="#27ae60" stroke-width="2" style="display:none;"></circle>
            </svg>
            <br>
            <button id="btnClearAct" class="btn-clear" onclick="clearCurrentSelection()">ලක්ෂ්‍ය අයින් කරන්න</button>
            <button id="btnClearAll" class="btn-clear" style="background-color: #c0392b;" onclick="clearAllShapes()"> සියල්ල හිස් කරන්න</button>
            <span id="m-histo" class="mark-status"></span>
        </div>

        <!-- 3. Question (iv) Section -->
        
         <table style="font-size:14px">
<tr><td rowspan=2><b>(iv)</b> ලකුණු 50ක් හෝ ඊට වඩා වැඩි වීමේ සම්භාවිතාව = </td><td width="60px" >		 <input type="number" id="prob-n"  class="short-input" placeholder="ලවය"  style="width:60px" > </td></tr><tr><td style="border-top:solid thin">
            <input type="number" id="prob-d" class="short-input" placeholder="හරය">
           </td>
		   <td rowspan=2><span id="m-prob" class="mark-status"></span></td></tr><table>
        

        <div style="text-align: center; margin-top: 4px;">
            <button id="btnCheck" class="btn-check" onclick="checkAndScore()">පිළිතුරු පරීක්ෂා කරන්න</button>
            <button id="btnShowAns" class="btn-show-ans" onclick="showCorrectAnswers()">නිවැරදි පිළිතුරු </button>
		<button id="btnClearAll" class="btn-clear" style="background-color: #c0392b;" onclick="res()"> නැවතත්</button>	
			
        </div>

        <div id="scoreBox" class="score-box"></div>
    </div>

    <script>
        const svg = document.getElementById('gridSvg');
        const activePointsG = document.getElementById('activePoints');
        const drawnPolygonsG = document.getElementById('drawnPolygons');
        const correctHistoG = document.getElementById('correctHistoG');
        const snapMarker = document.getElementById('snapMarker');

        const originX = 30, originY = 130;
        const widthPx = 280, heightPx = 125;

        let clickedPoints = [];
        let createdBars = [];
        let isLocked = false;

        // Marking Scheme Correct Histogram Bars
        const correctBars = [
            { xStart: 10, xEnd: 20, h: 20 },
            { xStart: 20, xEnd: 30, h: 40 },
            { xStart: 30, xEnd: 50, h: 30 },
            { xStart: 50, xEnd: 60, h: 70 },
            { xStart: 60, xEnd: 90, h: 20 }
        ];

        function toPxX(val) { return originX + (val / 100) * widthPx; }
        function toPxY(val) { return originY - (val / 90) * heightPx; }

        function initGrid() {
            let gridHtml = '', labelsHtml = '';

            for (let y = 0; y <= 90; y += 10) {
                let py = toPxY(y);
                gridHtml += `<line class="grid-line" x1="${originX}" y1="${py}" x2="${originX + widthPx}" y2="${py}" />`;
                labelsHtml += `<text x="10" y="${py + 3}">${y}</text>`;
            }
            for (let x = 0; x <= 100; x += 10) {
                let px = toPxX(x);
                gridHtml += `<line class="grid-line" x1="${px}" y1="${originY - heightPx}" x2="${px}" y2="${originY}" />`;
                labelsHtml += `<text x="${px - 4}" y="${originY + 12}">${x}</text>`;
            }

            document.getElementById('gridLines').innerHTML = gridHtml;
            document.getElementById('labels').innerHTML = labelsHtml;
            document.getElementById('axes').innerHTML = 
                `<line class="axis-line" x1="${originX}" y1="15" x2="${originX}" y2="${originY}" />` +
                `<line class="axis-line" x1="${originX}" y1="${originY}" x2="${originX + widthPx + 8}" y2="${originY}" />`;
        }

        function getSnappedPos(mousePx, mousePy) {
            let nearestX = null, nearestY = null;
            let minDistance = 10;

            for (let x = 0; x <= 100; x += 10) {
                let px = toPxX(x);
                if (Math.abs(px - mousePx) < minDistance) nearestX = x;
            }
            for (let y = 0; y <= 90; y += 10) {
                let py = toPxY(y);
                if (Math.abs(py - mousePy) < minDistance) nearestY = y;
            }

            if (nearestX !== null && nearestY !== null) {
                return { xVal: nearestX, yVal: nearestY, px: toPxX(nearestX), py: toPxY(nearestY) };
            }
            return null;
        }

        svg.addEventListener('mousemove', function(e) {
            if (isLocked) return;
            const rect = svg.getBoundingClientRect();
            const snap = getSnappedPos(e.clientX - rect.left, e.clientY - rect.top);

            if (snap) {
                svg.style.cursor = 'pointer';
                snapMarker.setAttribute('cx', snap.px);
                snapMarker.setAttribute('cy', snap.py);
                snapMarker.style.display = 'block';
            } else {
                svg.style.cursor = 'default';
                snapMarker.style.display = 'none';
            }
        });

        svg.addEventListener('click', function(e) {
            if (isLocked) return;
            const rect = svg.getBoundingClientRect();
            const snap = getSnappedPos(e.clientX - rect.left, e.clientY - rect.top);

            if (!snap) return;
            if (clickedPoints.some(p => p.xVal === snap.xVal && p.yVal === snap.yVal)) return;

            clickedPoints.push(snap);

            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", snap.px);
            circle.setAttribute("cy", snap.py);
            circle.setAttribute("class", "point-dot");
            activePointsG.appendChild(circle);

            if (clickedPoints.length === 4) {
                let pointsStr = clickedPoints.map(p => `${p.px},${p.py}`).join(' ');
                let polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                polygon.setAttribute("points", pointsStr);
                polygon.setAttribute("class", "user-bar");
                drawnPolygonsG.appendChild(polygon);

                let xVals = clickedPoints.map(p => p.xVal);
                let yVals = clickedPoints.map(p => p.yVal);
                createdBars.push({
                    xMin: Math.min(...xVals),
                    xMax: Math.max(...xVals),
                    yMax: Math.max(...yVals)
                });

                clearCurrentSelection();
            }
        });

        function clearCurrentSelection() {
            if (isLocked) return;
            clickedPoints = [];
            activePointsG.innerHTML = '';
            snapMarker.style.display = 'none';
        }

        function clearAllShapes() {
            if (isLocked) return;
            clearCurrentSelection();
            drawnPolygonsG.innerHTML = '';
            createdBars = [];
        }

        function setMark(elementId, statusId, isCorrect) {
            let el = document.getElementById(elementId);
            let st = document.getElementById(statusId);
            if (isCorrect) {
                el.className = 'correct-input';
                st.innerHTML = '✔';
                st.style.color = 'green';
            } else {
                el.className = 'wrong-input';
                st.innerHTML = '✖';
                st.style.color = 'red';
            }
        }

        function checkAndScore() {
            let score = 0;

            // (i) f Values [3 Marks]
            let f20 = parseInt(document.getElementById('f-20-30').value) === 40;
            let f50 = parseInt(document.getElementById('f-50-60').value) === 70;
            let f60 = parseInt(document.getElementById('f-60-90').value) === 60;
            setMark('f-20-30', 'm-f-20', f20);
            setMark('f-50-60', 'm-f-50', f50);
            setMark('f-60-90', 'm-f-60', f60);
            score += (f20 ? 1 : 0) + (f50 ? 1 : 0) + (f60 ? 1 : 0);

            // (iii) cf Values [2 Marks]
            let cf20 = parseInt(document.getElementById('cf-20-30').value) === 60;
            let cf30 = parseInt(document.getElementById('cf-30-50').value) === 120;
            let cf50 = parseInt(document.getElementById('cf-50-60').value) === 190;
            let cf60 = parseInt(document.getElementById('cf-60-90').value) === 250;
            setMark('cf-20-30', 'm-cf-20', cf20);
            setMark('cf-30-50', 'm-cf-30', cf30);
            setMark('cf-50-60', 'm-cf-50', cf50);
            setMark('cf-60-90', 'm-cf-60', cf60);
            let cfCount = (cf20 ? 1 : 0) + (cf30 ? 1 : 0) + (cf50 ? 1 : 0) + (cf60 ? 1 : 0);
            if (cfCount === 4) score += 2;
            else if (cfCount >= 1) score += 1;

            // (ii) Histogram [3 Marks]
            let b30_50 = createdBars.some(ub => ub.xMin === 30 && ub.xMax === 50 && ub.yMax === 30);
            let b60_90 = createdBars.some(ub => ub.xMin === 60 && ub.xMax === 90 && ub.yMax === 20);
            let bOther = createdBars.some(ub => ub.xMin === 10 && ub.xMax === 20 && ub.yMax === 20) &&
                         createdBars.some(ub => ub.xMin === 20 && ub.xMax === 30 && ub.yMax === 40) &&
                         createdBars.some(ub => ub.xMin === 50 && ub.xMax === 60 && ub.yMax === 70);

            let histoMarks = (b30_50 ? 1 : 0) + (b60_90 ? 1 : 0) + (bOther ? 1 : 0);
            score += histoMarks;
            document.getElementById('m-histo').innerHTML = histoMarks === 3 ? '✔ (3/3)' : `(${histoMarks}/3)`;
            document.getElementById('m-histo').style.color = histoMarks === 3 ? 'green' : 'orange';

            // (iv) Probability [2 Marks]
            let pn = parseInt(document.getElementById('prob-n').value);
            let pd = parseInt(document.getElementById('prob-d').value);
            let nCorrect = (pn === 130);
            let probCorrect = (pn === 130 && pd === 250) || (pn === 13 && pd === 25);
            
            setMark('prob-n', 'm-prob', probCorrect);
            if (nCorrect) score += 1;
            if (probCorrect) score += 1;

            // Score Display & Lock Controls
            let scoreBox = document.getElementById('scoreBox');
            scoreBox.style.display = 'block';
            scoreBox.innerHTML = `ලබාගත් මුළු ලකුණු සංඛ්‍යාව: <b>${score} / 10</b>`;

            // Lock and Show Answers Button
            isLocked = true;
            document.querySelectorAll('input').forEach(i => i.disabled = true);
            document.getElementById('btnClearAct').disabled = true;
            document.getElementById('btnClearAll').disabled = true;
            document.getElementById('btnShowAns').style.display = 'inline-block';
        }

        function showCorrectAnswers() {
		//-----  svg  හිස්කරන්න-----
            clearCurrentSelection();
            drawnPolygonsG.innerHTML = '';
            createdBars = [];
			
			//---------------
            // Fill correct answers in inputs
            document.getElementById('f-20-30').value = 40;
            document.getElementById('f-50-60').value = 70;
            document.getElementById('f-60-90').value = 60;

            document.getElementById('cf-20-30').value = 60;
            document.getElementById('cf-30-50').value = 120;
            document.getElementById('cf-50-60').value = 190;
            document.getElementById('cf-60-90').value = 250;

            document.getElementById('prob-n').value = 130;
            document.getElementById('prob-d').value = 250;

            // Draw Correct Histogram Bars in Green Dashed Style
            correctHistoG.innerHTML = '';
            correctBars.forEach(b => {
                let p1 = `${toPxX(b.xStart)},${toPxY(0)}`;
                let p2 = `${toPxX(b.xStart)},${toPxY(b.h)}`;
                let p3 = `${toPxX(b.xEnd)},${toPxY(b.h)}`;
                let p4 = `${toPxX(b.xEnd)},${toPxY(0)}`;

                let poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                poly.setAttribute("points", `${p1} ${p2} ${p3} ${p4}`);
                poly.setAttribute("class", "correct-bar");
                correctHistoG.appendChild(poly);
            });
			
			document.getElementById("m-f-20").innerHTML="";
			document.getElementById("m-f-50").innerHTML="";
			document.getElementById("m-f-60").innerHTML="";
			document.getElementById("m-cf-20").innerHTML="";
			document.getElementById("m-cf-30").innerHTML="";
			document.getElementById("m-cf-50").innerHTML="";
			document.getElementById("m-cf-60").innerHTML="";
			document.getElementById("m-prob").innerHTML="";
			scoreBox.innerHTML ="";
			
			document.getElementById("m-histo").innerHTML="";
			
			
        }

        initGrid();
		
		
		function res(){location.reload();}
    </script>
</body>
</html>
