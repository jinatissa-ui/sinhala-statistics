<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  /* මොඩියුල බෙදුම් පිටුවේ (මුල් පිටුවේ) විශේෂ පෙනුම */
  .panel {
    position: relative;
    width: 380px;
    height: 500px;
    border-radius: 16px;
    overflow: hidden;
    text-align: center;
    background:
      radial-gradient(230px 190px at 92% 4%, #ffd9e9 0%, rgba(255,217,233,0) 70%),
      radial-gradient(260px 220px at 2% 96%, #c9f2e7 0%, rgba(201,242,231,0) 72%),
      radial-gradient(180px 150px at 6% 6%, #fff0c4 0%, rgba(255,240,196,0) 75%),
      linear-gradient(168deg, #fffaea 0%, #f0fbf7 52%, #fff2f8 100%);
    box-shadow: 0 8px 20px rgba(30, 80, 80, .14), inset 0 0 0 1px rgba(14, 122, 128, .10);
  }

  /* soft decorative rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px dashed rgba(14, 122, 128, .22);
  }
  .r1 { width: 200px; height: 200px; top: -84px; left: -76px; }
  .r2 { width: 160px; height: 160px; bottom: -64px; right: -56px; border-color: rgba(224, 69, 123, .22); }

  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 540px;
    padding: 22px 22px 16px;
  }

  .chip {
    display: inline-block;
    padding: 5px 16px 6px;
    border-radius: 999px;
    background: #fff;
    border: 1.5px solid #7fd0c6;
    color: #0e7a80;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 3px 0 rgba(127, 208, 198, .45);
  }

  h1 {
    margin-top: 12px;
    font-size: 46px;
    line-height: 1.15;
    color: #0d6d74;
    font-weight: bold;
    letter-spacing: .5px;
    text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(13, 109, 116, .12);
  }
  h1 em { font-style: normal; color: #e0457b; }

  .eng {
    margin-top: 2px;
    font-size: 16px;
    letter-spacing: 4px;
    font-weight: bold;
    color: #9a8f88;
    font-family: Georgia, "Times New Roman", serif;
  }

  .rule {
    width: 96px;
    margin: 14px auto 12px;
  }

  .grade {
    font-size: 17px;
    color: #4c5a5f;
    letter-spacing: .3px;
  }

  .cloud {
    display: block;
    width: 278px;
    margin: auto 0 6px;
    filter: drop-shadow(0 10px 12px rgba(60, 120, 130, .20));
    animation: floaty 4.5s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }

  .dots { margin-top: 2px; }
  .dots i {
    display: inline-block;
    width: 9px; height: 9px;
    margin: 0 4px;
    border-radius: 50%;
    background: #7fd0c6;
  }
  .dots i:nth-child(2) { background: #ffcf3f; }
  .dots i:nth-child(3) { background: #f7a1be; }

  /* gentle entrance */
  .content > * { animation: rise .6s ease-out both; }
  .content > *:nth-child(2) { animation-delay: .06s; }
  .content > *:nth-child(3) { animation-delay: .12s; }
  .content > *:nth-child(4) { animation-delay: .18s; }
  .content > *:nth-child(5) { animation-delay: .24s; }
  .content > *:nth-child(6) { animation-delay: .30s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="panel">
    <div style="margin-left:100px;font-size:18px;text-align:left" >
