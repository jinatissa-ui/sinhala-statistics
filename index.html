var mobilePageNumber=null;
function fitMobilePage(){
var viewport=document.getElementById('mobilePageViewport');
var frame=document.getElementById('mobilePageFrame');
var cover=document.getElementById('mobileCoverPage');
var backCover=document.getElementById('mobileBackCover');
if(!viewport||!frame||!cover||!backCover){return;}
var scale=Math.min(1,viewport.clientWidth/470);
if(scale<=0){scale=1;}
frame.style.transform='scale('+scale+')';
cover.style.transform='scale('+scale+')';
backCover.style.transform='scale('+scale+')';
viewport.style.height=((mobilePageNumber===null||mobilePageNumber==='back'?360:550)*scale)+'px';
}
function showMobilePage(pageNumber){
var page=parseInt(pageNumber,10);
if(isNaN(page)||page<3||page>36){return;}
mobilePageNumber=page;
var frame=document.getElementById('mobilePageFrame');
frame.src='pages/page'+page+'.html';
frame.hidden=false;
document.getElementById('mobileCoverPage').style.display='none';
document.getElementById('mobileBackCover').style.display='none';
document.getElementById('mobilePageStatus').textContent='පිටුව '+page+' / 36';
document.getElementById('mobileBookControls').hidden=false;
document.getElementById('mobileStart').hidden=true;
document.querySelector('.mobile-cover-actions').hidden=true;
document.getElementById('mobilePrevious').disabled=page<=3;
document.getElementById('mobileNext').disabled=false;
document.getElementById('mobileLast').disabled=page>=36;
document.getElementById('mobileContents').hidden=true;
document.getElementById('mobileContentsToggle').setAttribute('aria-expanded','false');
fitMobilePage();
}
function showMobileBackCover(){
mobilePageNumber='back';
document.getElementById('mobilePageFrame').hidden=true;
document.getElementById('mobilePageFrame').removeAttribute('src');
document.getElementById('mobileCoverPage').style.display='none';
var backCover=document.getElementById('mobileBackCover');
backCover.style.display='flex';
document.getElementById('mobilePageStatus').textContent='පොතේ පසුපස කවරය';
document.getElementById('mobileBookControls').hidden=false;
document.getElementById('mobileStart').hidden=true;
document.querySelector('.mobile-cover-actions').hidden=true;
document.getElementById('mobilePrevious').disabled=false;
document.getElementById('mobileNext').disabled=true;
document.getElementById('mobileLast').disabled=true;
document.getElementById('mobileContents').hidden=true;
document.getElementById('mobileContentsToggle').setAttribute('aria-expanded','false');
fitMobilePage();
}
function showMobileCover(){
mobilePageNumber=null;
document.getElementById('mobilePageFrame').hidden=true;
document.getElementById('mobilePageFrame').removeAttribute('src');
document.getElementById('mobileBackCover').style.display='none';
document.getElementById('mobileCoverPage').style.display='flex';
document.getElementById('mobilePageStatus').textContent='පොතේ කවරය';
document.getElementById('mobileBookControls').hidden=true;
document.getElementById('mobileStart').hidden=false;
document.querySelector('.mobile-cover-actions').hidden=false;
document.getElementById('mobileContents').hidden=true;
document.getElementById('mobileContentsToggle').setAttribute('aria-expanded','false');
fitMobilePage();
}
function previousMobilePage(){
if(mobilePageNumber==='back'){showMobilePage(36);}
else if(mobilePageNumber>3){showMobilePage(mobilePageNumber-1);}
}
function nextMobilePage(){
if(mobilePageNumber===36){showMobileBackCover();}
else if(mobilePageNumber!==null&&mobilePageNumber<36){showMobilePage(mobilePageNumber+1);}
}
function toggleMobileContents(){
var contents=document.getElementById('mobileContents');
contents.hidden=!contents.hidden;
document.getElementById('mobileContentsToggle').setAttribute('aria-expanded',String(!contents.hidden));
document.getElementById('mobileCoverContentsToggle').setAttribute('aria-expanded',String(!contents.hidden));
if(!contents.hidden){contents.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
window.addEventListener('resize',fitMobilePage);
window.addEventListener('orientationchange',fitMobilePage);
